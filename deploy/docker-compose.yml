# PMForge on a single VPS: Caddy (HTTPS) -> frontend + backend -> Postgres.
# Only Caddy publishes ports. Secrets come from the project environment set in hPanel, never from this file.
name: pmforge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmforge
      POSTGRES_DB: pmforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (hex, no special characters)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmforge -d pmforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend-migrate:
    image: ghcr.io/shivajibravo1/pmforge-backend:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://pmforge:${POSTGRES_PASSWORD}@postgres:5432/pmforge?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  auth-migrate:
    image: ghcr.io/shivajibravo1/pmforge-frontend-migrate:${IMAGE_TAG:-latest}
    environment: &auth_env
      BETTER_AUTH_URL: https://${DOMAIN:-pmforge.pm}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ random characters)}
      DATABASE_URL: postgresql://pmforge:${POSTGRES_PASSWORD}@postgres:5432/pmforge?sslmode=disable
      TRUSTED_ORIGINS: https://${DOMAIN:-pmforge.pm}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      AUTH_TEST_EMAILS: ${AUTH_TEST_EMAILS:-}
      PMFORGE_LIVE: ${PMFORGE_LIVE:-false}
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  backend:
    image: ghcr.io/shivajibravo1/pmforge-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://pmforge:${POSTGRES_PASSWORD}@postgres:5432/pmforge?sslmode=disable
      CORS_ORIGINS: https://${DOMAIN:-pmforge.pm}
      JWKS_URL: http://frontend:3000/api/auth/jwks
      JWT_ISSUER: https://${DOMAIN:-pmforge.pm}
      JWT_AUDIENCE: pmforge-api
      ADMIN_EMAILS: ${ADMIN_EMAILS:-aishivajibravo@gmail.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY (with a billing limit)}
      MODEL_REVIEW: ${MODEL_REVIEW:-gpt-6.1-terra}
      MODEL_CHAT: ${MODEL_CHAT:-gpt-6-luna}
    depends_on:
      backend-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  frontend:
    image: ghcr.io/shivajibravo1/pmforge-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *auth_env
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      backend: { condition: service_started }
    networks: [internal]

  backup:
    # Nightly dump into /var/backups/pmforge on the VPS host. A host folder (not a Docker volume) so the
    # dumps survive deleting this project in Docker Manager. Same-server backup: see docs/DEPLOY_VPS.md.
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: pmforge
      PGDATABASE: pmforge
      PGPASSWORD: ${POSTGRES_PASSWORD}
    configs:
      - source: backup_script
        target: /backup.sh
    volumes:
      - /var/backups/pmforge:/backups
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # Healthy only while the newest daily dump is under 26 hours old.
      test: ["CMD-SHELL", "find /backups/daily -name 'pmforge-*.dump' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 15m
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-pmforge.pm}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    networks: [internal]

configs:
  backup_script:
    content: |
      set -eu
      umask 077
      B=/backups
      mkdir -p "$$B/daily" "$$B/weekly"
      while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ)
        tmp="$$B/daily/.pmforge-$$ts.tmp"
        # Keep a dump only if it is written in full and its table of contents can be read back.
        if pg_dump -Fc --no-owner -f "$$tmp" && pg_restore -l "$$tmp" > /dev/null; then
          mv "$$tmp" "$$B/daily/pmforge-$$ts.dump"
          if [ "$$(date -u +%u)" = "7" ]; then cp "$$B/daily/pmforge-$$ts.dump" "$$B/weekly/pmforge-$$ts.dump"; fi
          find "$$B/daily" -name 'pmforge-*.dump' -mtime +7 -delete
          find "$$B/weekly" -name 'pmforge-*.dump' -mtime +28 -delete
          echo "backup ok $$ts"
        else
          rm -f "$$tmp"
          echo "backup FAILED $$ts" >&2
        fi
        sleep 86400
      done
  caddyfile:
    content: |
      www.{$$DOMAIN} {
        redir https://{$$DOMAIN}{uri} permanent
      }
      {$$DOMAIN} {
        encode zstd gzip
        @api path /api/v1/* /public/* /health
        handle @api {
          reverse_proxy backend:8000
        }
        handle {
          reverse_proxy frontend:3000
        }
      }

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
